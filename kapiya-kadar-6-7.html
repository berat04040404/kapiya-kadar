function audioInit(){
 if(AC){if(AC.state=='suspended')AC.resume();return}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 try{AC=new C()}catch(e){AC=null;return}
 mg=AC.createGain();mg.gain.value=musicOn?.5:0;mg.connect(AC.destination);
 nz=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nz.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 try{const bin=atob(DEATH_B64),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  AC.decodeAudioData(u.buffer,b=>{dBuf=b},()=>{})}catch(e){}
 nextT=AC.currentTime+.1;mstep=0;setInterval(mSched,40)}

const MEL=[[72,76,79,84,79,76,79,0],[77,81,84,81,77,81,84,0],[79,83,86,83,79,83,86,0],[84,0,79,0,72,0,84,0],
 [76,76,0,76,72,76,79,0],[77,77,0,77,74,77,81,0],[79,81,83,84,86,84,83,81],[84,84,84,78,79,0,0,0]];
const BAS=[48,53,55,48,48,53,55,48];
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(type,f,t,dur,vol,det,f2){const o=AC.createOscillator(),g2=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);if(det)o.detune.value=det;
 g2.gain.setValueAtTime(0,t);g2.gain.linearRampToValueAtTime(vol,t+.008);g2.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g2);g2.connect(mg);o.start(t);o.stop(t+dur+.02)}
function hit(t,dur,vol,hp){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g2=AC.createGain();s.buffer=nz;f.type='highpass';f.frequency.value=hp;
 g2.gain.setValueAtTime(vol,t);g2.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g2);g2.connect(mg);s.start(t);s.stop(t+dur+.02)}
function mSched(){
 if(!AC||AC.state!='running')return;
 if(nextT<AC.currentTime-.5)nextT=AC.currentTime+.05;
 while(nextT<AC.currentTime+.2){
  const n=mstep%64,bar=n>>3,sl=n&7,loop=mstep>>6,sd=Math.max(.115,.17-loop*.006);
  if(!(scene==1&&lv==11)){
   const m=MEL[bar][sl];
   if(m){const f=mf(m);tone('square',f,nextT,sd*.9,.07,-9);tone('square',f,nextT,sd*.9,.07,9)}
   else if(bar%4==3&&sl%2==1)tone('triangle',900,nextT,sd*.95,.12,0,2600);
   const bm=BAS[bar]+(sl%2?12:0);tone('square',mf(bm),nextT,sd*.8,.09,0);
   hit(nextT,.03,.09,7000);
   if(sl==0||sl==4){tone('sine',160,nextT,.12,.35,0,45)}
   if(sl==2||sl==6)hit(nextT,.09,.18,1500);
  }
  nextT+=sd;mstep++}}

function buildGrid(){LV.forEach((q,i)=>{const t=document.createElement('div');t.className='tile';const c=document.createElement('canvas');c.width=64;c.height=40;try{icon(i,c)}catch(e){}t.appendChild(c);
 t.insertAdjacentHTML('beforeend','<div class="tn">'+(i+1)+'</div><div class="tl"></div><span class="tb"></span>');
 t.addEventListener('click',()=>{if(i<=best)startLevel(i)});grid.appendChild(t);tiles.push(t)})}
function startLevel(i){audioInit();if(i==lv&&resumable){cont();return}resumable=false;menu.style.display='none';scene=1;load(i)}
function refreshMenu(){if(!tiles.length)buildGrid();const fresh=best==0&&lv==0&&deaths==0&&!resumable;
 tiles.forEach((t,i)=>{t.className='tile'+(i>best?' lock':'')+(i==lv?' cur':'');t.querySelector('.tl').textContent=i>best?'???':LV[i].n.split(' · ')[1];t.querySelector('.tb').textContent=i>best?'🔒':(i<best?'✓':'')});
 document.getElementById('mi').textContent=fresh?'Henüz başlamadın':'Bölüm '+(lv+1)+' / '+LV.length+' · '+LV[lv].n.split(' · ')[1];
 document.getElementById('ms').textContent=fresh?'Kapıya git. Bu kadar.':'☠ '+deaths+' ölüm';
 mcb.textContent=fresh?'BAŞLA':'DEVAM ET';mrb.style.display=fresh?'none':'';disarm()}
function disarm(){armed=0;clearTimeout(armT);mrb.textContent='İLERLEMEYİ SİL'}
function showMenu(){keys.l=keys.r=keys.j=0;if(scene==1)resumable=true;scene=0;refreshMenu();menu.style.display='flex';const c=grid.querySelector('.cur');if(c)c.scrollIntoView({block:'center'})}
function cont(){menu.style.display='none';scene=1;if(!resumable)load(lv);resumable=false}
mcb.addEventListener('click',()=>{audioInit();cont()});

 disarm();resumable=false;lv=0;deaths=0;best=0;menu.style.display='none';scene=1;load(0)});

addEventListener('keydown',e=>{const k=e.code;
 if(k=='ArrowLeft'||k=='KeyA')keys.l=1;
 if(k=='ArrowRight'||k=='KeyD')keys.r=1;
 if(k=='ArrowUp'||k=='KeyW'||k=='Space'){keys.j=1;e.preventDefault()}
 if(k=='KeyR'&&scene==1)load(lv);
 if(scene==0&&(k=='Enter'||k=='Space')){cont();return}
 if(k=='KeyN'){skip(1);return}
 if(k=='KeyB'){skip(-1);return}
 if(k=='KeyN'||k=='BracketRight')goLv(1);
 if(k=='KeyP'||k=='BracketLeft')goLv(-1);
 startIf()});
addEventListener('keyup',e=>{const k=e.code;
 if(k=='ArrowLeft'||k=='KeyA')keys.l=0;
 if(k=='ArrowRight'||k=='KeyD')keys.r=0;
 if(k=='ArrowUp'||k=='KeyW'||k=='Space')keys.j=0});
function bind(id,k){const e=document.getElementById(id);
 const on=v=>ev=>{ev.preventDefault();keys[k]=v;if(v)startIf()};
 e.addEventListener('pointerdown',on(1));
 ['pointerup','pointercancel','pointerleave'].forEach(n=>e.addEventListener(n,on(0)))}
bind('bl','l');bind('br','r');bind('bu','j');
function skip(d){scene=1;lv=Math.max(0,Math.min(LV.length-1,lv+d));fl=0;load(lv)}

addEventListener('blur',()=>{keys.l=keys.r=keys.j=0});
document.addEventListener('visibilitychange',()=>{keys.l=keys.r=keys.j=0});

loadP();load(lv);refreshMenu();
let last=0,acc=0;
function frame(t){acc+=Math.min(50,t-last);last=t;while(acc>=16.67){const s=scene;upd();if(s==1&&scene==2){fl=performance.now();best=LV.length-1;try{localStorage.setItem(SK,JSON.stringify({lv:0,deaths:0,best:best}))}catch(e){}}acc-=16.67}draw();requestAnimationFrame(frame)}
